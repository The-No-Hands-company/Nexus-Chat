[package]
name = "nexus-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "REST API layer for Nexus"

[dependencies]
nexus-common = { workspace = true }
nexus-db = { workspace = true }
nexus-voice = { workspace = true }
nexus-federation = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
validator = { workspace = true }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
password-hash = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
ed25519-dalek = { workspace = true }
rand_core = { workspace = true }
p256 = { workspace = true }
url = { workspace = true }
hmac = { workspace = true }
aes-gcm = { workspace = true }
meilisearch-sdk = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-config = { workspace = true }
base64 = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
totp-rs = { workspace = true }
redis = { workspace = true }
reqwest = { workspace = true }
scylla = { workspace = true }
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing-subscriber = { workspace = true }
# Generates the throwaway RSA keypair the identity tests sign with. Present so
# that no private key material has to live in the source of a public repo —
# an embedded test PEM trips secret scanners forever and teaches people to wave
# them through. Already in the lock file transitively, so this costs no fetch.
rsa = "0.9"
rand_core = { workspace = true }

[[bench]]
name = "nexus_bench"
harness = false