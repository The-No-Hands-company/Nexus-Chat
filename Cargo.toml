[workspace]
resolver = "2"
members = [
    "crates/nexus-common",
    "crates/nexus-db",
    "crates/nexus-api",
    "crates/nexus-gateway",
    "crates/nexus-voice",
    "crates/nexus-federation",
    "crates/nexus-server",
    "crates/nexus-desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["The No-Hands Company"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/The-No-hands-Company/nexus"
description = "Privacy-first, community-owned communication platform"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
axum-extra = { version = "0.10", features = ["typed-header", "cookie"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "limit", "timeout"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "any", "uuid", "chrono", "json"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
scylla = { version = "0.15", default-features = false, features = ["ssl"] }

# Auth & Crypto
argon2 = "0.5"
jsonwebtoken = "9.3"
rand = "0.9"
uuid = { version = "1.11", features = ["v4", "v5", "v7", "serde"] }
# TOTP (RFC 6238) — 2FA secret generation and code verification
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Error handling
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"

# Config
dotenvy = "0.15"
config = "0.14"

# Validation
validator = { version = "0.19", features = ["derive"] }

# WebSocket
tokio-tungstenite = "0.26"
futures-util = "0.3"

# S3/Object storage
aws-sdk-s3 = { version = "1.65", features = ["behavior-version-latest"] }
aws-config = { version = "1.5", features = ["behavior-version-latest"] }

# Search
meilisearch-sdk = "0.27"
tantivy = { version = "0.22", default-features = false, features = ["mmap"] }

# Snowflake IDs
snowflaked = "1.0"

# Password hashing
password-hash = "0.5"

# Hashing utilities
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
blake3 = "1"
mime_guess = "2"
hmac = "0.12"
aes-gcm = "0.10"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }

# Ed25519 signing (federation)
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# URL parsing
url = "2.5"

# IP/Geo
ipnetwork = "0.20"

# Bitflags for permissions
bitflags = "2.6"

# WebRTC (Voice/Video SFU)
str0m = "0.16"
socket2 = "0.6"
bytes = "1"
nnnoiseless = "0.5"
systemstat = "0.2"

# HTTP client (desktop / tauri commands)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }

# Tauri desktop
tauri = { version = "2", features = ["tray-icon", "rustls-tls"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-store = "2"
tauri-plugin-http = "2"
tauri-plugin-os = "2"

# Shared internal crates
nexus-common = { path = "crates/nexus-common" }
nexus-db = { path = "crates/nexus-db" }
nexus-api = { path = "crates/nexus-api" }
nexus-gateway = { path = "crates/nexus-gateway" }
nexus-voice = { path = "crates/nexus-voice" }
nexus-federation = { path = "crates/nexus-federation" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
